// Source of truth for every node-to-node and client RPC.
// Stubs are generated into src/dsearch/proto/ by scripts/gen_proto.py (see D-001).

syntax = "proto3";

package dsearch;

// Implemented by every node (coordinator, shard primary, replica).
service Node {
  // Liveness and identity check, used by tests and cluster scripts.
  rpc Ping(PingRequest) returns (PingReply);
}

message PingRequest {}

message PingReply {
  string node_id = 1;
  string role = 2;
}

// ---- Update log -------------------------------------------------------
// One sequenced operation. Stored in each node's update log (D-008) and,
// from Phase 3, sent unchanged in replication and recovery streams.

enum OpType {
  OP_TYPE_UNSPECIFIED = 0;
  OP_TYPE_INSERT = 1;
  OP_TYPE_REPLACE = 2;
  OP_TYPE_DELETE = 3;
}

message LogEntry {
  uint64 seq = 1;         // per-shard sequence number, dense from 1
  OpType op_type = 2;
  string doc_id = 3;
  uint64 version = 4;     // client-supplied document version (D-003)
  optional string text = 5;  // absent for deletes
}

// ---- Shard nodes ------------------------------------------------------
// Served by every shard primary and replica. Write and Replicate are
// served only by primaries (others answer FAILED_PRECONDITION).

service Shard {
  // Assign the next seq to a write, log + fsync it, apply it, then ack (D-013).
  rpc Write(WriteRequest) returns (WriteReply);

  // Replica pull (D-012): stream every entry with seq > from_seq, then a
  // caught_up_seq marker, then new entries live as they are applied.
  rpc Replicate(ReplicateRequest) returns (stream ReplicateMessage);

  // This copy's share of the ranking statistics for a query's terms.
  rpc GetStats(StatsRequest) returns (CorpusStats);

  // Local top-k for a query, scored with the given global statistics.
  rpc SearchShard(ShardSearchRequest) returns (ShardSearchReply);

  // Every stored doc (live and tombstoned) plus applied_seq, for convergence checks.
  rpc DumpState(DumpStateRequest) returns (DumpStateReply);

  // Replication and recovery status of this copy, for scripts and evaluation (D-025).
  rpc GetStatus(StatusRequest) returns (StatusReply);

  // Full rebuild (D-031): the primary's whole state at one seq, in chunks.
  // Used only when Replicate answers OUT_OF_RANGE (log truncated past the
  // replica's applied_seq, D-030) or when the replica is forced to (D-032).
  rpc FetchSnapshot(FetchSnapshotRequest) returns (stream SnapshotChunk);
}

message WriteRequest {
  OpType op_type = 1;
  string doc_id = 2;
  uint64 version = 3;
  optional string text = 4;  // absent for deletes
}

message WriteReply {
  uint64 seq = 1;
  bool applied = 2;  // false: version not newer, a logged no-op (D-003)
}

message ReplicateRequest {
  string replica_id = 1;
  uint64 from_seq = 2;  // the replica's persisted applied_seq
}

message ReplicateMessage {
  reserved 1;  // was a single LogEntry before batching (D-034)
  oneof kind {
    uint64 caught_up_seq = 2;  // all entries up to here have been sent
    EntryBatch entries = 3;    // consecutive entries, written by the replica as one group commit
  }
}

message EntryBatch {
  repeated LogEntry entries = 1;
}

message StatsRequest {
  string query = 1;
}

message CorpusStats {
  uint64 doc_count = 1;
  uint64 total_length = 2;
  map<string, uint64> doc_freq = 3;
}

message ShardSearchRequest {
  string query = 1;
  CorpusStats global_stats = 2;
  uint32 k = 3;
}

message SearchHit {
  string doc_id = 1;
  double score = 2;  // double round-trips exactly, so scores compare with == (D-006)
}

message ShardSearchReply {
  repeated SearchHit hits = 1;
  uint64 applied_seq = 2;
}

message DumpStateRequest {}

message DocRecord {
  string doc_id = 1;
  uint64 version = 2;
  optional string text = 3;  // absent = tombstone
}

message DumpStateReply {
  uint64 applied_seq = 1;
  repeated DocRecord docs = 2;
}

message StatusRequest {}

message FetchSnapshotRequest {
  string replica_id = 1;
}

message SnapshotChunk {
  uint64 seq = 1;                 // the snapshot's seq, the same in every chunk
  repeated DocRecord docs = 2;    // live docs and tombstones
}

// One replica catch-up session: from connecting until the caught_up_seq marker.
message RecoverySession {
  uint64 from_seq = 1;
  uint64 caught_up_seq = 2;
  uint64 entries_replayed = 3;    // log entries applied (after the snapshot, for a full rebuild)
  double seconds = 4;
  bool full_rebuild = 5;          // started with FetchSnapshot instead of replaying from from_seq
  uint64 snapshot_docs = 6;       // docs installed by the full rebuild
}

message StatusReply {
  string node_id = 1;
  string role = 2;               // "primary" or "replica"
  uint64 applied_seq = 3;
  uint64 last_logged_seq = 4;
  uint64 log_bytes = 5;
  uint64 snapshot_seq = 6;
  uint64 local_replayed = 7;     // log entries replayed from local disk at startup
  bool live = 8;                 // replica: past the caught_up marker on a live stream
  repeated RecoverySession recoveries = 9;  // replica: since this process started
  uint32 full_rebuilds = 10;
  uint64 first_logged_seq = 11;  // older entries were truncated (D-030)
  double open_seconds = 12;      // local snapshot load + log replay at startup
}

// ---- Coordinator (client entry point) ---------------------------------

service Coordinator {
  // Route a write by crc32(doc_id) % N to that shard's primary (D-017, D-020).
  rpc Write(WriteRequest) returns (CoordinatorWriteReply);

  // Two-phase scatter-gather: global stats, then per-shard top-k merged into
  // the global top-k, ties broken by doc_id (D-018, D-019).
  rpc Search(SearchRequest) returns (SearchReply);
}

message CoordinatorWriteReply {
  uint32 shard_id = 1;
  uint64 seq = 2;
  bool applied = 3;  // false: version not newer, a logged no-op
}

message SearchRequest {
  string query = 1;
  uint32 k = 2;
}

message SearchReply {
  repeated SearchHit hits = 1;
  repeated string copies_read = 2;  // address of the copy read for each shard, by shard id
}
